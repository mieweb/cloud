# PR preview packages.
#
# On every push to a same-repo pull request, publish every public @mieweb/*
# workspace package to the GitHub Packages npm registry (npm.pkg.github.com)
# as `<version>-pr<PR>.<run>` under the dist-tag `pr<PR>`. This lets
# cross-repo PRs depend on each other with ordinary semver references while
# they are in review, e.g.
#
#   "@mieweb/deploy-contract": "0.2.1-pr14.3"
#
# plus, in the consumer, an .npmrc line:
#
#   @mieweb:registry=https://npm.pkg.github.com
#
# Once the PRs merge, the real versions go to npmjs via release.yml and the
# consumers drop the .npmrc line and switch to the released version.
#
# Installing from GitHub Packages needs a token with `read:packages`, even for
# public packages.
name: PR preview packages

on:
  pull_request:

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Two jobs so PR-controlled code never runs with a write token: `pack` installs,
# stamps and packs (read-only token; lifecycle scripts run here), and `publish`
# only uploads the resulting tarballs with --ignore-scripts. It never checks out
# or executes the PR's code.
permissions:
  contents: read

jobs:
  pack:
    # Same-repo branches only (fork PRs can't publish anyway).
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      packages: ${{ steps.stamp.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@mieweb'

      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Stamp preview versions
        id: stamp
        env:
          SUFFIX: pr${{ github.event.pull_request.number }}.${{ github.run_number }}
        run: |
          node -e '
            const fs = require("fs"), path = require("path");
            const out = [];
            for (const dir of fs.readdirSync("packages")) {
              const f = path.join("packages", dir, "package.json");
              if (!fs.existsSync(f)) continue;
              const p = JSON.parse(fs.readFileSync(f, "utf8"));
              if (p.private) continue;
              p.version = `${p.version.replace(/-.*$/, "")}-${process.env.SUFFIX}`;
              fs.writeFileSync(f, JSON.stringify(p, null, 2) + "\n");
              out.push(`${p.name}@${p.version}`);
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `packages=${out.join(" ")}\n`);
          '

      # pnpm pack rewrites workspace:* to the stamped versions and runs prepack.
      - name: Pack
        run: |
          mkdir -p "$RUNNER_TEMP/tarballs"
          for d in packages/*/; do
            [ "$(node -p "require('./${d}package.json').private === true")" = true ] && continue
            (cd "$d" && pnpm pack --pack-destination "$RUNNER_TEMP/tarballs")
          done
          ls "$RUNNER_TEMP/tarballs"

      - uses: actions/upload-artifact@v4
        with:
          name: tarballs
          path: ${{ runner.temp }}/tarballs/*.tgz
          retention-days: 1

  publish:
    needs: pack
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tarballs
          path: tarballs

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@mieweb'

      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for t in ./tarballs/*.tgz; do
            npm publish "$t" --ignore-scripts --tag pr${{ github.event.pull_request.number }}
          done

      - name: Summary
        env:
          PACKAGES: ${{ needs.pack.outputs.packages }}
        run: |
          {
            echo "### Preview packages (npm.pkg.github.com)"
            echo
            echo "Add \`@mieweb:registry=https://npm.pkg.github.com\` to .npmrc, then:"
            echo
            for p in $PACKAGES; do echo "- \`$p\`"; done
          } >> "$GITHUB_STEP_SUMMARY"
